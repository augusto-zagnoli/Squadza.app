<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="d-flex align-items-center mb-4">
        <a routerLink="/admin" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h3 class="mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Novo Jogo</h3>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }
          <form (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Data do Jogo</label>
              <input type="date" class="form-control" [(ngModel)]="gameDate" name="gameDate" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Horário</label>
              <input type="time" class="form-control" [(ngModel)]="gameTime" name="gameTime" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Local</label>
              <input type="text" class="form-control" [(ngModel)]="location" name="location"
                     placeholder="Ex: Quadra da Escola Municipal" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col">
                <label class="form-label">Valor por Pessoa (R$)</label>
                <input type="number" class="form-control" [(ngModel)]="pricePerPerson" name="price" min="1" required>
              </div>
              <div class="col">
                <label class="form-label">Máximo de Vagas</label>
                <input type="number" class="form-control" [(ngModel)]="maxPlayers" name="maxPlayers" min="2" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              @if (loading) { <span class="spinner-border spinner-border-sm me-2"></span> }
              Criar Jogo
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
