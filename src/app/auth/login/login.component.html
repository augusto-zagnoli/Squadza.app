<div class="min-vh-100 d-flex align-items-center bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="bi bi-volleyball text-primary" style="font-size: 2.5rem;"></i>
              <h2 class="mt-2 fw-bold">Squadza</h2>
              <p class="text-muted">Entre na sua conta</p>
            </div>

            @if (error) {
              <div class="alert alert-danger py-2">{{ error }}</div>
            }

            <form (ngSubmit)="submit()">
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                @if (loading) { <span class="spinner-border spinner-border-sm me-2"></span> }
                Entrar
              </button>
            </form>

            <hr>
            <p class="text-center mb-0">
              Não tem conta? <a routerLink="/register">Cadastrar</a>
            </p>
          </div>
        </div>

        <div class="text-center mt-3">
          <a routerLink="/inscricao"
             class="btn btn-outline-success btn-sm px-4">
            <i class="bi bi-list-check me-2"></i>Ver lista de inscrições
          </a>
          <p class="text-muted small mt-2 mb-0">
            Compartilhe este link com o grupo do WhatsApp
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
